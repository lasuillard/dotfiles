name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git to rewrite SSH to HTTPS with Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check formatting of shell scripts
        run: |
          git ls-files '*.sh' \
            | tee /dev/stderr \
            | xargs nix run '.#shfmt' -- --diff

      - name: Check formatting of Nix files
        run: |
          git ls-files '*.nix' \
            | tee /dev/stderr \
            | xargs nix run '.#nixfmt' -- --check

      - name: Lint shell scripts
        run: |
          git ls-files '*.sh' \
            | tee /dev/stderr \
            | xargs nix run '.#shellcheck' --

      - name: Nix check
        run: nix flake check --impure --show-trace

      - name: Nix evaluate
        run: nix eval --impure '.#default.drvPath'

  test:
    name: Test (${{ matrix.runs-on }})
    needs: lint
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            timeout-minutes: 30
          - runs-on: ubuntu-24.04-arm # No "latest" available for this architecture
            timeout-minutes: 30
          - runs-on: macos-latest
            timeout-minutes: 60

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git to rewrite SSH to HTTPS with Token
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false

      - name: Build activation package
        run: nix build --impure '.#default'

      - name: Run installation script
        run: ./install
